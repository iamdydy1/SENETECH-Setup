name: Build SENETECH Develop

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - BUILD-DEV

permissions:
  contents: write

jobs:
  build-develop:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Build V1.6.0 DEV package
        shell: pwsh
        run: python tools/build_develop.py --repo .

      - name: Verify generated package
        shell: pwsh
        run: |
          $manifest = Get-Content version.json -Raw | ConvertFrom-Json
          $zip = Join-Path 'dist' 'SENETECH-Setup-V1.6.0-DEV.zip'
          if (-not (Test-Path $zip)) { throw 'Develop package missing.' }
          if ((Get-Item $zip).Length -ne [int64]$manifest.packageSize) { throw 'Package size mismatch.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne ([string]$manifest.sha256).ToLowerInvariant()) { throw 'Package SHA-256 mismatch.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('SENETECH-Setup.exe','_SENETECH/SENETECH-Setup.ps1','_SENETECH/Modules/Senetech.Catalog.ps1','_SENETECH/Modules/Senetech.Technician.ps1','_SENETECH/Catalog/apps.json')) {
              if ($names -notcontains $required) { throw "Missing from package: $required" }
            }
          } finally { $archive.Dispose() }

      - name: Publish package to develop branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json dist/SENETECH-Setup-V1.6.0-DEV.zip dist/SENETECH-Setup-V1.6.0-DEV.sha256
          if (Test-Path BUILD-DEV) { git rm -f BUILD-DEV }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build SENETECH V1.6.0 DEV package [skip build]"
            git push origin develop
          }
