name: Validate SENETECH Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($file.FullName)::$($_.Message)" }
              throw "PowerShell syntax failure: $($file.FullName)"
            }
          }
          Write-Host "Parsed $($files.Count) PowerShell scripts."

      - name: Validate develop manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content .\version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.channel -ne 'develop') { throw 'version.json channel must be develop.' }
          if (-not $m.version) { throw 'version.json version missing.' }
          [void](New-Object System.Version([string]$m.version))
          if ([string]::IsNullOrWhiteSpace([string]$m.patchUrl)) { throw 'patchUrl missing.' }
          if ([string]::IsNullOrWhiteSpace([string]$m.incrementalPatchUrl)) { throw 'incrementalPatchUrl missing.' }
          if ([string]::IsNullOrWhiteSpace([string]$m.patchSha256)) { throw 'patchSha256 missing.' }
          if ([string]::IsNullOrWhiteSpace([string]$m.incrementalPatchSha256)) { throw 'incrementalPatchSha256 missing.' }
          if ([string]$m.patchUrl -match '/develop/') { throw 'patchUrl is not commit-pinned.' }
          if ([string]$m.incrementalPatchUrl -match '/develop/') { throw 'incrementalPatchUrl is not commit-pinned.' }
          foreach ($overlay in @($m.overlayFiles)) {
            if ([string]$overlay.url -match '/develop/') { throw "Overlay is not commit-pinned: $($overlay.path)" }
          }
          Write-Host "Manifest $($m.displayVersion) is structurally valid."

      - name: Verify published patch SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content .\version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $pairs = @(
            @{ Url=[string]$m.patchUrl; Hash=[string]$m.patchSha256; Name='fallback' },
            @{ Url=[string]$m.incrementalPatchUrl; Hash=[string]$m.incrementalPatchSha256; Name='incremental' }
          )
          foreach ($p in $pairs) {
            $path = Join-Path $env:TEMP ("senetech-" + $p.Name + ".ps1")
            Invoke-WebRequest -UseBasicParsing -Uri ($p.Url + '?ci=' + [guid]::NewGuid().ToString('N')) -OutFile $path
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $p.Hash.ToLowerInvariant()) { throw "$($p.Name) patch SHA mismatch: $actual" }
            Write-Host "$($p.Name) patch SHA-256 OK."
          }

      - name: Download Stable base
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content .\version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          Invoke-WebRequest -UseBasicParsing -Uri ([string]$m.baseDownloadUrl) -OutFile "$env:TEMP\senetech-base.zip"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "$env:TEMP\senetech-base.zip").Hash.ToLowerInvariant()
          if ($actual -ne ([string]$m.baseSha256).ToLowerInvariant()) { throw "Stable base SHA mismatch: $actual" }
          Write-Host 'Stable base SHA-256 OK.'

      - name: Simulate Stable to Develop build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:TEMP 'senetech-fallback-stage'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path "$env:TEMP\senetech-base.zip" -DestinationPath $stage -Force
          & .\src\PATCH-SENETECH-1.6.0-v28.ps1 -StageDir $stage
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Fallback patch exit $LASTEXITCODE" }

          $version = Get-Content (Join-Path $stage 'VERSION.txt') -Raw
          if ($version -notmatch '1\.6\.0\.23') { throw 'Fallback stage did not reach build 23.' }

          $engine = Get-Content (Join-Path $stage '_SENETECH\SENETECH-Setup.ps1') -Raw -Encoding UTF8
          if ($engine -notmatch "\$script:AppVersion\s*=\s*'1\.6\.0\.23'") { throw 'Engine AppVersion is not build 23.' }
          if ($engine.Contains('Title=\"SENETECH Setup V1.6.0 DEV - build 23\"')) { throw 'Broken escaped XAML title detected.' }

          $manifestPath = Join-Path $stage '_SENETECH\SENETECH-Setup.manifest'
          try { [void][xml](Get-Content $manifestPath -Raw -Encoding UTF8) }
          catch { throw "Runtime XML manifest invalid: $($_.Exception.Message)" }

          $scripts = Get-ChildItem -LiteralPath $stage -Filter *.ps1 -File -Recurse
          foreach ($file in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "Staged script syntax failure: $($file.FullName): $($errors[0].Message)" }
          }
          Write-Host "Stable-to-Develop simulation OK with $($scripts.Count) staged scripts."

      - name: Validate updater hardening markers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $u = Get-Content .\src\UPDATE-SENETECH-V23.ps1 -Raw -Encoding UTF8
          foreach ($required in @(
            'Add-CacheBuster',
            'Test-PowerShellSyntax',
            'Reset-ManagedRuntime',
            'startup.begin',
            'startup.ok',
            'startup.error',
            'AddSeconds(60)',
            'Launcher exited while waiting for runtime marker'
          )) {
            if (-not $u.Contains($required)) { throw "Updater hardening marker missing: $required" }
          }
          Write-Host 'Updater hardening checks OK.'
