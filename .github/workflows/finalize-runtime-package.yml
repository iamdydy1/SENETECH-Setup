name: Finalize SENETECH runtime package

on:
  push:
    paths:
      - '.github/staging/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild runtime ZIP
        shell: bash
        run: |
          mkdir -p dist
          cat .github/staging/SENETECH-Setup-V1.4.2.zip.b64.part* | tr -d '\r\n' | base64 --decode > dist/SENETECH-Setup-V1.4.2.zip
          echo "f36f81c05f6eb529a3e27095c79683652e957176e3fe4f6ae6e663a1570641b4  dist/SENETECH-Setup-V1.4.2.zip" | sha256sum -c -

      - name: Commit final package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/SENETECH-Setup-V1.4.2.zip
          git rm -f .github/staging/SENETECH-Setup-V1.4.2.zip.b64.part* .github/staging/READY
          git commit -m "release: finalize SENETECH Setup V1.4.2 runtime package [skip ci]"
          git push
