name: Publish SENETECH V1.5.1 Stable

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-stable-v1.5.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-stable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build full V1.5.1 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'senetech-stage'
          $baseZip = Join-Path $env:RUNNER_TEMP 'senetech-base.zip'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $baseZip -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $parts = Get-ChildItem 'packages/v1.4.2/part*.b64' | Sort-Object Name
          if (-not $parts -or $parts.Count -eq 0) { throw 'Package V1.4.2 base parts are missing.' }
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append(((Get-Content $part.FullName -Raw) -replace '\s',''))
          }
          [IO.File]::WriteAllBytes($baseZip,[Convert]::FromBase64String($builder.ToString()))

          $baseHash = (Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -ne 'f36f81c05f6eb529a3e27095c79683652e957176e3fe4f6ae6e663a1570641b4') {
            throw "Base package SHA-256 mismatch: $baseHash"
          }

          Expand-Archive -Path $baseZip -DestinationPath $stage -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'packages/v1.5.1/PATCH-SENETECH-1.5.1.ps1' -StageDir $stage
          if ($LASTEXITCODE -ne 0) { throw "V1.5.1 patch failed with exit code $LASTEXITCODE" }

          $engine = Join-Path $stage '_SENETECH/SENETECH-Setup.ps1'
          $exe = Join-Path $stage 'SENETECH-Setup.exe'
          if (-not (Test-Path $exe)) { throw 'SENETECH-Setup.exe missing from full stable runtime.' }
          if (-not (Test-Path $engine)) { throw 'SENETECH engine missing from full stable runtime.' }
          $engineText = Get-Content $engine -Raw
          if ($engineText -notmatch "AppVersion = '1\.5\.1\.0'") { throw 'Engine is not V1.5.1.' }
          if ($engineText -notmatch 'Show-SenetechSettings') { throw 'Stable/Developer settings are missing.' }
          if ($engineText -notmatch 'Install-SenetechOnThisPc') { throw 'Installed mode is missing.' }

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $distZip = 'dist/SENETECH-Setup-V1.5.1-STABLE.zip'
          Remove-Item $distZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $distZip -CompressionLevel Optimal
          $hash = (Get-FileHash $distZip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'dist/SENETECH-Setup-V1.5.1-STABLE.sha256' -Value $hash -Encoding ascii

          # main devient réellement la base Stable 1.5.1.
          Copy-Item (Join-Path $stage 'SENETECH-Setup.exe') 'SENETECH-Setup.exe' -Force
          if (Test-Path '_SENETECH') { Remove-Item '_SENETECH' -Recurse -Force }
          Copy-Item (Join-Path $stage '_SENETECH') '_SENETECH' -Recurse -Force
          foreach ($file in @('VERSION.txt','LISEZ-MOI.txt','CHANGELOG.txt')) {
            if (Test-Path (Join-Path $stage $file)) { Copy-Item (Join-Path $stage $file) $file -Force }
          }
          New-Item -ItemType Directory -Path 'Hors-ligne/Applications' -Force | Out-Null
          New-Item -ItemType Directory -Path 'Hors-ligne/Pilotes' -Force | Out-Null
          Set-Content -Path 'Hors-ligne/Applications/.keep' -Value '' -NoNewline
          Set-Content -Path 'Hors-ligne/Pilotes/.keep' -Value '' -NoNewline

          $manifest = [ordered]@{
            product = 'SENETECH Setup'
            channel = 'stable'
            version = '1.5.1.0'
            displayVersion = '1.5.1'
            enabled = $true
            mandatory = $false
            downloadUrl = 'https://raw.githubusercontent.com/iamdydy1/SENETECH-Setup/main/dist/SENETECH-Setup-V1.5.1-STABLE.zip'
            packageSize = (Get-Item $distZip).Length
            sha256 = $hash
            releaseNotes = @(
              'SENETECH Setup V1.5.1 - base Stable officielle',
              'Package complet avec SENETECH-Setup.exe',
              'Modes Portable et Installé dans une seule application',
              'Canal Stable par défaut sur main',
              'Canal Développeur disponible depuis Paramètres',
              'Les prochaines fonctions de test seront développées sur develop'
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path 'version.json' -Encoding utf8

      - name: Commit stable runtime
        shell: pwsh
        run: |
          git config user.name 'SENETECH Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SENETECH-Setup.exe _SENETECH VERSION.txt LISEZ-MOI.txt CHANGELOG.txt Hors-ligne dist version.json
          if (git diff --cached --quiet) {
            Write-Host 'Nothing to commit.'
            exit 0
          }
          git commit -m 'release: set V1.5.1 as stable full runtime [skip ci]'
          git push origin main
